<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xhlijinlong 的个人主页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .tag {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 自动加载你的 GitHub 头像 -->
        <img class="avatar" src="https://github.com/xhlijinlong.png" alt="xhlijinlong">
        <h1>你好，我是 xhlijinlong 👋</h1>
        <p class="subtitle">Java / C# / Python 开发者 | 探索 Docker & AI Agent</p>
        
        <div class="tags">
            <span class="tag">Java</span>
            <span class="tag">C#</span>
            <span class="tag">Python</span>
            <span class="tag">Docker</span>
            <span class="tag">AI Agent</span>
        </div>

        <a class="btn" href="https://github.com/xhlijinlong" target="_blank">访问我的 GitHub 主页</a>
    </div>
</body>
</html>
